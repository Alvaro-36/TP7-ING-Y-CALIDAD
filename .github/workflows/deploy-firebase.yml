# =============================================================================
# Despliegue automatico a Firebase Hosting
#
# Se ejecuta automaticamente cada vez que se realiza un push a la rama main
# (por ejemplo al mergear un Pull Request).
#
# Requiere el secreto FIREBASE_TOKEN configurado en el repositorio.
# =============================================================================
name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy-hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TP6---IyC/package-lock.json

      - name: Instalar dependencias (npm ci)
        working-directory: TP6---IyC
        run: npm ci

      - name: Compilar aplicacion frontend (Vite build)
        working-directory: TP6---IyC
        run: npm run build

      - name: Desplegar a Firebase Hosting
        run: npx firebase-tools deploy --only hosting --token "${FIREBASE_TOKEN}" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
