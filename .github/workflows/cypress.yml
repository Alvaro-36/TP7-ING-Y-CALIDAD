name: Cypress sobre main y rollback con Git

on:
  push:
    branches: [main]

# Solo el job de rollback recibe permiso de escritura.
permissions:
  contents: read

env:
  PUSH_SHA: ${{ github.event.after }}

jobs:
  e2e:
    name: Probar el commit que llego a main
    if: ${{ !github.event.deleted && !contains(github.event.head_commit.message, 'Auto-Rollback-Of:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tests_failed: ${{ steps.cypress.outputs.tests_failed }}
    steps:
      - name: Descargar el commit exacto del push
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.after }}
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: TP6---IyC/package-lock.json

      - name: Instalar dependencias y Cypress
        working-directory: TP6---IyC
        run: |
          npm ci
          npx --no-install cypress install
          npx --no-install cypress verify

      - name: Iniciar la aplicacion y esperar a que responda
        working-directory: TP6---IyC
        run: |
          npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/vite.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/vite.pid"
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const deadline = Date.now() + 60000;
            while (Date.now() < deadline) {
              try {
                const response = await fetch('http://localhost:5173', {
                  signal: AbortSignal.timeout(2000)
                });
                if (response.ok) return;
              } catch {}
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            console.error(fs.readFileSync(process.env.RUNNER_TEMP + '/vite.log', 'utf8'));
            throw new Error('La aplicacion no inicio en http://localhost:5173.');
          })().catch(error => {
            console.error(`::error::${error.message}`);
            process.exitCode = 1;
          });
          NODE

      - name: Ejecutar los tests E2E existentes
        id: cypress
        continue-on-error: true
        timeout-minutes: 15
        working-directory: TP6---IyC
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const cypress = require('cypress');
          const output = failed => fs.appendFileSync(process.env.GITHUB_OUTPUT, `tests_failed=${failed}\n`);
          output(false);
          (async () => {
            const result = await cypress.run({
              configFile: 'cypress.config.js',
              browser: 'electron',
              config: { video: true }
            });
            if (result.failures || !Number.isFinite(result.totalFailed) || !result.totalTests) {
              throw new Error('Cypress no pudo ejecutar tests; no se activa rollback por un fallo de infraestructura.');
            }
            if (result.totalFailed > 0) {
              output(true);
              console.error(`::error::Fallaron ${result.totalFailed} tests E2E.`);
              process.exitCode = 1;
            } else if ((result.runs || []).some(run => run.error) || !result.totalPassed) {
              throw new Error('Ejecucion incompleta de Cypress; no se activa rollback automatico.');
            }
          })().catch(error => {
            console.error(`::error::${error.message}`);
            process.exitCode = 1;
          });
          NODE

      - name: Detener la aplicacion
        if: ${{ always() }}
        run: |
          if [[ -f "$RUNNER_TEMP/vite.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/vite.pid")" 2>/dev/null || true
          fi

      - name: Guardar evidencias de Cypress
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-main-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TP6---IyC/cypress/screenshots
            TP6---IyC/cypress/videos
            ${{ runner.temp }}/vite.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Marcar la ejecucion fallida
        if: ${{ always() && steps.cypress.outcome == 'failure' }}
        run: |
          echo '::error::Cypress fallo. Solo tests fallidos habilitan el job de rollback.'
          exit 1

  rollback:
    name: Revertir el commit fallido en main
    needs: e2e
    if: ${{ always() && !cancelled() && needs.e2e.outputs.tests_failed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Descargar el commit que fallo y su historial
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.after }}
          fetch-depth: 0
          persist-credentials: false

      - name: Crear el revert y publicarlo en main
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stage='preparacion'
          report_failure() {
            echo "::error::Rollback incompleto en la etapa: $stage. No se fuerza ningun push ni se reescribe el historial. Revisar main y los logs."
          }
          trap report_failure ERR
          if [[ ! "$PUSH_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::El evento no contiene un SHA de commit valido.'
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$PUSH_SHA" ]]; then
            echo '::error::El commit descargado no coincide con el SHA del push.'
            exit 1
          fi
          # Autenticacion temporal; el token no se guarda en origin ni se imprime.
          cat > "$RUNNER_TEMP/git-askpass.sh" <<'SH'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_PUSH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/git-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh"
          export GIT_TERMINAL_PROMPT=0
          git config credential.helper ''
          git config core.hooksPath /dev/null
          stage='comprobacion de main'
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$PUSH_SHA" ]]; then
            echo '::error::main avanzo desde este push. Se requiere revision; no se revierte un estado antiguo.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          stage='git revert'
          parent_count="$(git show -s --format=%P "$PUSH_SHA" | wc -w)"
          if [[ "$parent_count" -gt 1 ]]; then
            git revert --no-commit -m 1 "$PUSH_SHA"
          else
            git revert --no-commit "$PUSH_SHA"
          fi
          stage='creacion del commit de reversion'
          git commit -m "Revert $PUSH_SHA por fallo E2E [skip ci]" \
            -m "Auto-Rollback-Of: $PUSH_SHA"
          stage='push del revert (comprobar permisos y proteccion de main)'
          # Push normal: si main avanzo o las reglas lo rechazan, falla sin forzar.
          git push origin HEAD:refs/heads/main
          echo "Se publico un nuevo commit que revierte $PUSH_SHA."
